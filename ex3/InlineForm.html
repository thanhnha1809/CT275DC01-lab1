<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Bài 3 - Biểu mẫu đăng nhập dạng một dòng</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        
        <link rel="stylesheet" href="css/all.min.css" />
    </head>
    <body class="bg-light py-5">
        <div class="container d-flex justify-content-center">
            <div class="card w-100 shadow border-primary-subtle" style="max-width: 1050px;">
                <div class="card-header bg-primary text-white fw-semibold py-3 fs-4">
                    Biểu mẫu đăng nhập
                </div>
                <div class="card-body p-5">
                    <form class="row g-3 align-items-center">
                        <div class="col-md">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text text-secondary">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="email" class="form-control py-3" id="email" placeholder="Nhập vào email">
                            </div>
                        </div>

                        <div class="col-md">
                            <div class="input-group input-group-lg">
                                <span class="input-group-text text-secondary">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control py-3" id="password" placeholder="Nhập vào mật khẩu">
                            </div>
                        </div>

                        <div class="col-auto">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" style="transform: scale(1.3);">
                                <label class="form-check-label text-secondary fs-5 ms-2" for="rememberMe">
                                    Ghi nhớ tôi
                                </label>
                            </div>
                        </div>

                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary btn-lg py-3 px-4 fs-5">Đăng nhập</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
