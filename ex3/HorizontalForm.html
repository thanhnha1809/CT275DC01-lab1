<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Bài 3 - Biểu mẫu đăng nhập dạng ngang</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="css/all.min.css" />
    </head>
    <body class="bg-light py-5">
        <div class="container d-flex justify-content-center">
            <div class="card w-100 shadow border-primary-subtle" style="max-width: 700px;">
                <div class="card-header text-primary fw-semibold bg-primary-subtle border-bottom border-primary-subtle py-3 fs-5">
                    Biểu mẫu đăng nhập
                </div>
                <div class="card-body p-5">
                    <form>
                        <div class="mb-4 row align-items-center">
                            <label for="email" class="col-sm-3 col-form-label col-form-label-lg text-end fw-semibold text-secondary">Email:</label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control form-control-lg" id="email" placeholder="Nhập vào email">
                            </div>
                        </div>

                        <div class="mb-4 row align-items-center">
                            <label for="password" class="col-sm-3 col-form-label col-form-label-lg text-end fw-semibold text-secondary">Mật khẩu:</label>
                            <div class="col-sm-9">
                                <input type="password" class="form-control form-control-lg" id="password" placeholder="Nhập vào mật khẩu">
                            </div>
                        </div>

                        <div class="mb-4 row">
                            <div class="col-sm-9 offset-sm-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" style="transform: scale(1.2);">
                                    <label class="form-check-label text-secondary fs-6 ms-1" for="rememberMe">
                                        Ghi nhớ tôi
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-9 offset-sm-3">
                                <button type="submit" class="btn btn-primary btn-lg px-5">Đăng nhập</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
