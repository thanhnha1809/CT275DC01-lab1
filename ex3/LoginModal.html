
 <!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>Bài 3 - Hộp thoại đăng nhập lớn hơn</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

        <link rel="stylesheet" href="css/all.min.css" />
    </head>
    <body class="bg-light py-5">
        <div class="container">

            <div class="card shadow-sm border-danger p-4 mb-4" style="max-width: 600px;">
                <h4 class="text-secondary mb-3">Mở biểu mẫu đăng nhập</h4>
                <div>
                    <button type="button" class="btn btn-info text-white btn-lg px-5 py-3 fs-5" data-bs-toggle="modal" data-bs-target="#loginModal">
                        Mở hộp thoại
                    </button>
                </div>
            </div>

            <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered" style="max-width: 700px;">
                    <div class="modal-content border-danger shadow-lg">

                        <div class="modal-header bg-white border-bottom py-4">
                            <h4 class="modal-title w-100 text-center fw-bold fs-3" id="loginModalLabel">
                                <i class="fas fa-lock me-2"></i>Đăng nhập
                            </h4>
                            <button type="button" class="btn-close fs-5" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <div class="modal-body p-5">
                            <form>

                                <div class="mb-4">
                                    <label for="username" class="form-label fw-semibold text-secondary fs-5">
                                        <i class="fas fa-user me-2"></i>Người dùng:
                                    </label>
                                    <input type="text" class="form-control form-control-lg py-3 fs-5" id="username" placeholder="Nhập tên người dùng">
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label fw-semibold text-secondary fs-5">
                                        <i class="fas fa-eye me-2"></i>Mật khẩu:
                                    </label>
                                    <input type="password" class="form-control form-control-lg py-3 fs-5" id="password" placeholder="Nhập mật khẩu">
                                </div>

                                <div class="mb-4 form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" style="transform: scale(1.3);">
                                    <label class="form-check-label text-secondary fs-5 ms-2" for="rememberMe">
                                        Ghi nhớ tôi
                                    </label>
                                </div>

                                <div class="d-grid mb-2">
                                    <button type="submit" class="btn btn-success btn-lg py-3 fs-4">
                                        <i class="fas fa-power-off me-2"></i>Đăng nhập
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div class="modal-footer justify-content-between bg-white border-top py-4 px-5">
                            <button type="button" class="btn btn-danger btn-lg px-4 fs-5" data-bs-dismiss="modal">
                                <i class="fas fa-times me-2"></i>Hủy bỏ
                            </button>
                            <div class="text-end fs-6">
                                <div>Bạn chưa phải là thành viên? <a href="#" class="text-decoration-none fw-semibold">Đăng ký</a></div>
                                <div class="mt-1"><a href="#" class="text-decoration-none fw-semibold">Quên mật khẩu?</a></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
</body>
</html>
